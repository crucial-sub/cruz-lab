<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서가 격리 시험 문서</title>
<!--
  문서 서가 1단계 격리 시험 문서 (Plan 2.1 C4, 8.1 3)
  - 서가에 올려 문서 출처(raw…/d/{id}/index.html)에서 연다. 열리면 바로 시도하고 결과를 화면에 적는다.
  - 문서의 스크립트가 블로그 관리자 API로 쓰기를 보내도 막히는지, 읽기 응답을 읽지 못하는지 본다.
    서버의 403(ORIGIN_MISMATCH)은 smoke:library가 같은 요청을 직접 보내 따로 확인한다.
  - 결과: 화면의 표, <pre id="isolation-results">의 JSON, 문서 제목(ISOLATION:PASS / ISOLATION:FAIL).
    자동 점검은 헤드리스 Chrome으로 이 문서를 열고 제목과 JSON을 읽는다.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0 auto; max-width: 760px; padding: 20px 16px 48px; line-height: 1.55; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #8884; vertical-align: top; }
  .pass { color: #16a34a; font-weight: 700; }
  .fail { color: #dc2626; font-weight: 700; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #8881; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<h1>서가 격리 시험 문서</h1>
<p>블로그 출처: <code id="site">…</code></p>
<p id="summary">시험 중…</p>
<table>
  <thead><tr><th>시도</th><th>기대</th><th>결과</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="isolation-results"></pre>
<script>
  // 블로그 출처: 문서 출처 호스트 이름에서 블로그 호스트를 구한다
  // - 운영: raw.cruzlab.dev → www.cruzlab.dev
  // - 미리보기: raw-preview.cruzlab.dev → preview.cruzlab.dev ('raw-'를 뗀다)
  // - 개발: raw.localhost:4321 → localhost:4321
  function siteOrigin() {
    const host = location.host;
    if (host.startsWith('raw-')) return `${location.protocol}//${host.slice(4)}`;
    if (!host.startsWith('raw.')) return location.origin;
    const rest = host.slice(4);
    const name = rest.replace(/:\d+$/, '');
    const blogHost = name === 'localhost' || name.endsWith('.localhost') ? rest : `www.${rest}`;
    return `${location.protocol}//${blogHost}`;
  }
  const SITE = siteOrigin();
  document.getElementById('site').textContent = SITE;

  // 시간 제한이 있는 시도
  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
  }

  // 응답을 읽을 수 있으면 실패(격리가 깨짐), 읽지 못하면 통과
  async function expectUnreadable(url, init) {
    try {
      const res = await withTimeout(fetch(url, { credentials: 'include', ...init }), 8000);
      const text = await res.text();
      return { pass: false, detail: `읽음: ${res.status} ${text.slice(0, 80)}` };
    } catch (error) {
      return { pass: true, detail: `막힘: ${error && error.name}` };
    }
  }

  const ATTEMPTS = [
    {
      id: 'write-post',
      what: '관리자 API로 POST (단순 요청)',
      expect: '응답을 읽지 못한다. 서버는 403',
      run: () => expectUnreadable(`${SITE}/api/admin/library/uploads`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: '{}' }),
    },
    {
      id: 'write-delete',
      what: '관리자 API로 DELETE',
      expect: '사전 요청에서 막힌다',
      run: () => expectUnreadable(`${SITE}/api/admin/library/docs/00000000000000000000`, { method: 'DELETE' }),
    },
    {
      id: 'read-session',
      what: 'GET /api/admin/session 읽기',
      expect: '본문을 읽지 못한다',
      run: () => expectUnreadable(`${SITE}/api/admin/session`, { method: 'GET' }),
    },
    {
      id: 'read-library',
      what: 'GET /admin/library 읽기',
      expect: '본문을 읽지 못한다',
      run: () => expectUnreadable(`${SITE}/admin/library`, { method: 'GET' }),
    },
    {
      id: 'frame-read',
      what: '서가 화면을 iframe으로 열고 내용 읽기',
      expect: '내용을 읽지 못한다',
      run: () =>
        new Promise((resolve) => {
          const frame = document.createElement('iframe');
          frame.style.display = 'none';
          const done = (result) => {
            frame.remove();
            resolve(result);
          };
          frame.onload = () => {
            try {
              const text = frame.contentDocument && frame.contentDocument.body ? frame.contentDocument.body.innerText : null;
              done(text === null ? { pass: true, detail: '막힘: 문서 없음' } : { pass: false, detail: `읽음: ${text.slice(0, 80)}` });
            } catch (error) {
              done({ pass: true, detail: `막힘: ${error && error.name}` });
            }
          };
          setTimeout(() => done({ pass: true, detail: '막힘: 열리지 않음' }), 8000);
          frame.src = `${SITE}/admin/library`;
          document.body.appendChild(frame);
        }),
    },
    {
      id: 'cookie-visible',
      what: 'document.cookie에 관리자·문서 쿠키가 보이는가',
      expect: '보이지 않는다(HttpOnly, 호스트 전용)',
      run: async () => {
        const cookies = document.cookie;
        const leaked = /(^|;\s*)(cruz_admin|cruz_doc)=/.test(cookies);
        return { pass: !leaked, detail: leaked ? `보임: ${cookies.slice(0, 80)}` : '보이지 않음' };
      },
    },
    {
      id: 'storage',
      what: 'localStorage 쓰고 읽기 (L3: 저장 켬)',
      expect: '된다',
      run: async () => {
        try {
          const key = `isolation-test-${Date.now()}`;
          localStorage.setItem(key, 'ok');
          const ok = localStorage.getItem(key) === 'ok';
          localStorage.removeItem(key);
          return { pass: ok, detail: ok ? '됨' : '값이 다름' };
        } catch (error) {
          return { pass: false, detail: `안 됨: ${error && error.name}` };
        }
      },
    },
  ];

  (async () => {
    const results = [];
    const rows = document.getElementById('rows');
    for (const attempt of ATTEMPTS) {
      let result;
      try {
        result = await attempt.run();
      } catch (error) {
        result = { pass: false, detail: `시험 오류: ${error && error.message}` };
      }
      results.push({ id: attempt.id, pass: result.pass, detail: result.detail });
      const row = document.createElement('tr');
      row.innerHTML = '<td></td><td></td><td></td>';
      row.children[0].textContent = attempt.what;
      row.children[1].textContent = attempt.expect;
      row.children[2].textContent = `${result.pass ? '통과' : '실패'} — ${result.detail}`;
      row.children[2].className = result.pass ? 'pass' : 'fail';
      rows.appendChild(row);
    }
    const allPass = results.every((r) => r.pass);
    document.getElementById('summary').textContent = allPass ? '모두 통과' : '실패가 있습니다';
    document.getElementById('summary').className = allPass ? 'pass' : 'fail';
    document.getElementById('isolation-results').textContent = JSON.stringify({ site: SITE, allPass, results }, null, 2);
    document.title = `ISOLATION:${allPass ? 'PASS' : 'FAIL'}`;
  })();
</script>
</body>
</html>
