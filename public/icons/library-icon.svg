<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 서가 아이콘 원본 (서가 2단계 Plan J25). PNG는 scripts/ops/library-icons.mjs가 만든다 -->
  <!-- 블로그 아이콘(사람 그림, 흰 바탕)과 헷갈리지 않게 초록 바탕의 책장 모양이다 -->
  <!-- 그림은 가운데 원(반지름 200) 안에 둔다. 마스크 아이콘(maskable)의 안전 영역이다 -->
  <defs>
    <linearGradient id="library-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect id="library-bg-shape" width="512" height="512" rx="112" fill="url(#library-bg)" />
  <g transform="translate(0 -10)">
    <!-- 선반 -->
    <rect x="128" y="352" width="256" height="20" rx="6" fill="#ecfdf5" />
    <!-- 선 책 셋 -->
    <rect x="148" y="176" width="40" height="176" rx="6" fill="#ffffff" />
    <rect x="148" y="196" width="40" height="8" fill="#059669" opacity="0.45" />
    <rect x="148" y="320" width="40" height="8" fill="#059669" opacity="0.45" />
    <rect x="196" y="208" width="36" height="144" rx="6" fill="#d1fae5" />
    <rect x="196" y="226" width="36" height="8" fill="#059669" opacity="0.45" />
    <rect x="240" y="160" width="44" height="192" rx="6" fill="#ffffff" />
    <rect x="240" y="182" width="44" height="8" fill="#059669" opacity="0.45" />
    <rect x="240" y="318" width="44" height="8" fill="#059669" opacity="0.45" />
    <!-- 기댄 책 하나: 아래 왼쪽 모서리를 축으로 왼쪽으로 14도 기울인다 -->
    <g transform="rotate(-14 322 352)">
      <rect x="322" y="196" width="38" height="156" rx="6" fill="#a7f3d0" />
      <rect x="322" y="216" width="38" height="8" fill="#059669" opacity="0.45" />
    </g>
  </g>
</svg>
